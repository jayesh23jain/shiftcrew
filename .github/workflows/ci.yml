name: CI
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: server } }
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    env:
      TEST_MONGO_URI: mongodb://127.0.0.1:27017/shiftcrew_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Integration tests (real MongoDB)
        run: npm run test:integration
      - name: Concurrency tests (real MongoDB, parallel requests)
        run: npm run test:concurrency
  client:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run build
